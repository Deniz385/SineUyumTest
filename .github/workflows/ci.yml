name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel the previous run when a new push arrives for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SineUyum.Api.sln

      - name: Build
        run: dotnet build SineUyum.Api.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SineUyum.Api.sln --configuration Release --no-build --verbosity normal

      - name: Check for model changes without a migration
        # If entities change without a Postgres migration being added, the
        # production schema no longer matches. This check catches that. Since
        # migrations are kept for Postgres (SQLite uses EnsureCreated in dev), the
        # provider must be Postgres; the model comparison needs no live database.
        env:
          # Design-time only; not a real key/connection.
          JWT_KEY: ci-only-placeholder-key-not-a-secret-must-be-64-bytes-long-xxxxxx
          Database__Provider: Postgres
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=sineuyum;Username=postgres;Password=postgres"
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project SineUyum.Api/SineUyum.Api.csproj \
            --no-build --configuration Release

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sine-uyum-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sine-uyum-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sine_uyum_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version pinned so that analysis rules introduced by a new Flutter
          # stable do not break CI unexpectedly. Upgrade deliberately
          # (together with the sdk constraint in pubspec).
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test
